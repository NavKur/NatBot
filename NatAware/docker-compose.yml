# Optional: the production-shaped infrastructure. NOT needed for the demo (DEMO_MODE=true).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nataware
      POSTGRES_PASSWORD: nataware
      POSTGRES_DB: nataware
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
